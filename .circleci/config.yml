version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Build and push Docker images
          command: |
            # Login to Docker Hub
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            
            # Build and push each service
            for service in udagram-api-feed udagram-api-user udagram-frontend udagram-reverseproxy; do
              echo "--------------------------------------"
              echo "Building and Pushing: $service"
              echo "--------------------------------------"
              docker build -t $service ./$service
              docker tag $service $DOCKER_USERNAME/$service:v1
              docker push $DOCKER_USERNAME/$service:v1
            done

workflows:
  main:
    jobs:
      - build
